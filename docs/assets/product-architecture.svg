<svg xmlns="http://www.w3.org/2000/svg" class="architecture-svg" viewBox="0 0 1120 1450" role="img" aria-labelledby="title desc">
  <title id="title">AgXRAW four-layer product architecture and peer bounded contexts</title>
  <desc id="desc">Presentation, Application, Domain, and Infrastructure form four software layers. Capture Evidence, Development, and Delivery are peer bounded contexts in one Domain layer. The Development Plan contains a Tone Plan and a Color Plan.</desc>
  <style>
    .architecture-svg { --foreground:#172033; --muted-foreground:#667085; --background:#fff; --card:#fbfcfe; --canvas:#f7f8fb; --border:#d8dee9; --blue:#3578e5; --green:#2e9b68; --purple:#7a55c7; --orange:#dc7a27; font-family:ui-sans-serif,system-ui,sans-serif; shape-rendering:geometricPrecision; text-rendering:optimizeLegibility; }
    @media (prefers-color-scheme: dark) { .architecture-svg { --foreground:#edf1f7; --muted-foreground:#9da7b8; --background:#11151d; --card:#171c26; --canvas:#0d1118; --border:#343c4c; --blue:#68a0ff; --green:#52c88a; --purple:#a98af0; --orange:#f0a15c; } }
    .canvas { fill:var(--canvas); }
    .title { fill:var(--foreground); font-size:24px; font-weight:500; letter-spacing:.2px; }
    .subtitle { fill:var(--muted-foreground); font-size:13px; }
    .legend { fill:var(--muted-foreground); font-size:12px; }
    .layer&gt;.layer-shell { fill:color-mix(in srgb,var(--card) 92%,transparent); stroke:color-mix(in srgb,var(--border) 88%,transparent); stroke-width:1px; }
    .presentation&gt;.layer-shell { fill:color-mix(in srgb,var(--blue) 4%,var(--card)); }
    .application&gt;.layer-shell { fill:color-mix(in srgb,var(--purple) 4%,var(--card)); }
    .domain-layer&gt;.layer-shell { fill:color-mix(in srgb,var(--green) 5%,var(--card)); stroke:color-mix(in srgb,var(--green) 48%,var(--border)); stroke-width:1.25px; }
    .infrastructure&gt;.layer-shell { fill:color-mix(in srgb,var(--orange) 4%,var(--card)); }
    .layer-accent { fill:none; stroke-width:4px; stroke-linecap:round; opacity:.9; }
    .presentation .layer-accent { stroke:var(--blue); } .application .layer-accent { stroke:var(--purple); } .domain-layer .layer-accent { stroke:var(--green); } .infrastructure .layer-accent { stroke:var(--orange); }
    .layer-divider { fill:none; stroke:color-mix(in srgb,var(--border) 76%,transparent); stroke-width:1px; }
    .layer-title { fill:var(--foreground); font-size:16px; font-weight:500; }
    .layer-note,.behavior,.kind,.context-subtitle { fill:var(--muted-foreground); font-size:12px; }
    .peer rect,.usecase rect,.capability rect,.object&gt;.object-shell { fill:color-mix(in srgb,var(--background) 82%,transparent); stroke:color-mix(in srgb,var(--border) 90%,transparent); stroke-width:1px; }
    .peer rect { fill:color-mix(in srgb,var(--blue) 6%,var(--background)); stroke:color-mix(in srgb,var(--blue) 28%,var(--border)); }
    .usecase rect { fill:color-mix(in srgb,var(--purple) 6%,var(--background)); stroke:color-mix(in srgb,var(--purple) 28%,var(--border)); }
    .capability rect { fill:color-mix(in srgb,var(--orange) 6%,var(--background)); stroke:color-mix(in srgb,var(--orange) 28%,var(--border)); }
    .peer text,.usecase text,.capability&gt;text:first-of-type { fill:var(--foreground); font-size:13px; font-weight:500; }
    .context&gt;.context-shell { stroke-width:1.2px; }
    .capture-context&gt;.context-shell { fill:color-mix(in srgb,var(--blue) 5%,var(--background)); stroke:color-mix(in srgb,var(--blue) 62%,var(--border)); }
    .development-context&gt;.context-shell { fill:color-mix(in srgb,var(--green) 5%,var(--background)); stroke:color-mix(in srgb,var(--green) 62%,var(--border)); }
    .delivery-context&gt;.context-shell { fill:color-mix(in srgb,var(--purple) 5%,var(--background)); stroke:color-mix(in srgb,var(--purple) 62%,var(--border)); }
    .context-divider { fill:none; stroke-width:1px; opacity:.42; }
    .capture-context .context-divider { stroke:var(--blue); } .development-context .context-divider { stroke:var(--green); } .delivery-context .context-divider { stroke:var(--purple); }
    .context-title,.object-title { fill:var(--foreground); font-size:15px; font-weight:500; }
    .context-rule,.invariant { fill:var(--foreground); font-size:12px; font-weight:500; }
    .aggregate&gt;.object-shell { stroke-width:2px; }
    .capture-context .aggregate&gt;.object-shell { fill:color-mix(in srgb,var(--blue) 9%,var(--background)); stroke:var(--blue); }
    .development-context .aggregate&gt;.object-shell { fill:color-mix(in srgb,var(--green) 9%,var(--background)); stroke:var(--green); }
    .delivery-context .aggregate&gt;.object-shell { fill:color-mix(in srgb,var(--purple) 9%,var(--background)); stroke:var(--purple); }
    .kind-pill { stroke:none; } .capture-context .kind-pill { fill:color-mix(in srgb,var(--blue) 16%,transparent); } .development-context .kind-pill { fill:color-mix(in srgb,var(--green) 16%,transparent); } .delivery-context .kind-pill { fill:color-mix(in srgb,var(--purple) 16%,transparent); }
    .kind { font-size:11px; font-weight:500; }
    .plan-part rect { stroke-width:1px; } .tone-part rect { fill:color-mix(in srgb,var(--orange) 8%,var(--background)); stroke:color-mix(in srgb,var(--orange) 48%,var(--border)); } .color-part rect { fill:color-mix(in srgb,var(--purple) 8%,var(--background)); stroke:color-mix(in srgb,var(--purple) 48%,var(--border)); }
    .plan-part-title { fill:var(--foreground); font-size:12px; font-weight:500; } .plan-part-en { fill:var(--muted-foreground); font-size:10px; } .plan-part-note { fill:var(--muted-foreground); font-size:9px; } .plan-invariant { font-size:11px; }
    .layer-flow,.object-flow,.context-flow { fill:none; stroke-linecap:round; } .layer-flow { stroke:var(--muted-foreground); stroke-width:1.7px; opacity:.82; } .object-flow { stroke:color-mix(in srgb,var(--muted-foreground) 72%,transparent); stroke-width:1.25px; } .context-flow { stroke:var(--foreground); stroke-width:1.7px; opacity:.78; }
    .contract-label-bg { stroke-width:1px; } .capture-contract { fill:color-mix(in srgb,var(--blue) 12%,var(--card)); stroke:color-mix(in srgb,var(--blue) 42%,var(--border)); } .delivery-contract { fill:color-mix(in srgb,var(--purple) 12%,var(--card)); stroke:color-mix(in srgb,var(--purple) 42%,var(--border)); }
    .context-contract { fill:var(--foreground); font-size:9px; font-weight:500; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="var(--muted-foreground)"/></marker>
    <marker id="contract-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="var(--foreground)"/></marker>
  </defs>
  <rect class="canvas" width="1120" height="1450"/>
  <text class="title" x="560" y="34" text-anchor="middle">AgXRAW four-layer product architecture</text>
  <text class="subtitle" x="560" y="58" text-anchor="middle">Three bounded contexts are peers inside one Domain layer; contexts are not architecture layers.</text>
  <text class="legend" x="560" y="80" text-anchor="middle">Heavy border = aggregate root · Regular border = domain object / strategy / policy · Arrow = layer call or domain contract</text>

  <g class="layer presentation">
    <rect class="layer-shell" x="24" y="104" width="1072" height="126" rx="14"/><path class="layer-accent" d="M31 120 L31 214"/><path class="layer-divider" d="M48 164 L1072 164"/>
    <text class="layer-title" x="48" y="134">01  Presentation</text><text class="layer-note" x="48" y="156">Accepts human or programmatic requests; presents results, progress, explanations, and errors.</text>
    <g class="peer"><rect x="48" y="174" width="238" height="38" rx="8"/><text x="167" y="198" text-anchor="middle">Local visual interface</text></g>
    <g class="peer"><rect x="308" y="174" width="238" height="38" rx="8"/><text x="427" y="198" text-anchor="middle">CLI batch processing</text></g>
    <g class="peer"><rect x="568" y="174" width="238" height="38" rx="8"/><text x="687" y="198" text-anchor="middle">Programmatic API</text></g>
    <g class="peer"><rect x="828" y="174" width="244" height="38" rx="8"/><text x="950" y="198" text-anchor="middle">Reports and diagnostics</text></g>
  </g>
  <path class="layer-flow" d="M560 230 L560 254" marker-end="url(#arrow)"/>

  <g class="layer application">
    <rect class="layer-shell" x="24" y="266" width="1072" height="180" rx="14"/><path class="layer-accent" d="M31 282 L31 430"/><path class="layer-divider" d="M48 328 L1072 328"/>
    <text class="layer-title" x="48" y="296">02  Application · Use Cases</text><text class="layer-note" x="48" y="318">Orchestrates one session; does not define reliable evidence, legal development, or valid delivery.</text>
    <g class="usecase"><rect x="48" y="340" width="238" height="38" rx="7"/><text x="167" y="364" text-anchor="middle">Import and prepare capture</text></g>
    <g class="usecase"><rect x="308" y="340" width="238" height="38" rx="7"/><text x="427" y="364" text-anchor="middle">Analyze capture evidence</text></g>
    <g class="usecase"><rect x="568" y="340" width="238" height="38" rx="7"/><text x="687" y="364" text-anchor="middle">Set viewing + development intent</text></g>
    <g class="usecase"><rect x="828" y="340" width="244" height="38" rx="7"/><text x="950" y="364" text-anchor="middle">Compile development plan</text></g>
    <g class="usecase"><rect x="178" y="392" width="238" height="38" rx="7"/><text x="297" y="416" text-anchor="middle">Preview and bounded adjust</text></g>
    <g class="usecase"><rect x="438" y="392" width="238" height="38" rx="7"/><text x="557" y="416" text-anchor="middle">Export SDR / HDR renditions</text></g>
    <g class="usecase"><rect x="698" y="392" width="238" height="38" rx="7"/><text x="817" y="416" text-anchor="middle">Explain and diagnose</text></g>
  </g>
  <path class="layer-flow" d="M560 446 L560 470" marker-end="url(#arrow)"/>

  <g class="layer domain-layer">
    <rect class="layer-shell" x="24" y="482" width="1072" height="714" rx="14"/><path class="layer-accent" d="M31 498 L31 1180"/><path class="layer-divider" d="M48 546 L1072 546"/>
    <text class="layer-title" x="48" y="512">03  Domain</text><text class="layer-note" x="48" y="534">Sole owner of the ubiquitous language and business invariants; all three contexts are peers in this layer.</text>

    <g class="context capture-context">
      <rect class="context-shell" x="48" y="558" width="320" height="602" rx="12"/><path class="context-divider" d="M68 646 L348 646"/>
      <text class="context-title" x="68" y="588">Capture Evidence context</text><text class="context-subtitle" x="68" y="610">Capture Evidence</text><text class="context-rule" x="68" y="634">Sensor facts do not choose aesthetics.</text>
      <g class="object aggregate"><rect class="object-shell" x="68" y="658" width="280" height="148" rx="9"/><text class="object-title" x="84" y="684">Capture</text><rect class="kind-pill" x="82" y="691" width="86" height="20" rx="10"/><text class="kind" x="125" y="705" text-anchor="middle">Aggregate root</text><text class="behavior" x="84" y="730">• Holds sensor evidence and scene frame</text><text class="behavior" x="84" y="752">• Preserves decode/calibration provenance</text><text class="behavior" x="84" y="774">• Reuses reconstruction across declared WB</text><text class="invariant" x="84" y="794">Decoder choice cannot rewrite evidence</text></g>
      <path class="object-flow" d="M208 806 L208 830" marker-end="url(#arrow)"/>
      <g class="object"><rect class="object-shell" x="68" y="842" width="280" height="128" rx="9"/><text class="object-title" x="84" y="868">Capture Analysis</text><text class="behavior" x="84" y="894">• Resolves full well, clipping &amp; dynamic range</text><text class="behavior" x="84" y="916">• Estimates noise and reliable highlight tail</text><text class="invariant" x="84" y="948">Reconstruction cannot become evidence</text></g>
      <path class="object-flow" d="M208 970 L208 994" marker-end="url(#arrow)"/>
      <g class="object"><rect class="object-shell" x="68" y="1006" width="280" height="126" rx="9"/><text class="object-title" x="84" y="1032">Spatial Color Permission</text><text class="behavior" x="84" y="1058">• Compiles headroom, clip class and SNR</text><text class="behavior" x="84" y="1080">• Grants available color-path freedom</text><text class="invariant" x="84" y="1110">No spatial evidence, no fabricated mask</text></g>
    </g>

    <g class="context development-context">
      <rect class="context-shell" x="400" y="558" width="320" height="602" rx="12"/><path class="context-divider" d="M420 646 L700 646"/>
      <text class="context-title" x="420" y="588">Development context</text><text class="context-subtitle" x="420" y="610">Development</text><text class="context-rule" x="420" y="634">Intent is declared; plans are adjudicated.</text>
      <g class="object"><rect class="object-shell" x="420" y="658" width="280" height="112" rx="9"/><text class="object-title" x="436" y="684">Development Intent</text><text class="behavior" x="436" y="708">• Declares WB, EV, film and display target</text><text class="behavior" x="436" y="730">• Separates automatic result from user bias</text><text class="invariant" x="436" y="756">User bias cannot rewrite capture facts</text></g>
      <path class="object-flow" d="M560 770 L560 792" marker-end="url(#arrow)"/>
      <g class="object aggregate"><rect class="object-shell" x="420" y="804" width="280" height="188" rx="9"/><text class="object-title" x="436" y="830">Development Plan</text><rect class="kind-pill" x="434" y="837" width="126" height="20" rx="10"/><text class="kind" x="497" y="851" text-anchor="middle">Aggregate / read-only</text><g class="plan-part tone-part"><rect x="436" y="870" width="122" height="80" rx="8"/><text class="plan-part-title" x="497" y="891" text-anchor="middle">Tone Plan</text><text class="plan-part-en" x="497" y="908" text-anchor="middle">Tone Compression</text><text class="plan-part-note" x="497" y="931" text-anchor="middle">anchor · endpoints · HDR</text></g><g class="plan-part color-part"><rect x="562" y="870" width="122" height="80" rx="8"/><text class="plan-part-title" x="623" y="891" text-anchor="middle">Color Plan</text><text class="plan-part-en" x="623" y="908" text-anchor="middle">Color Geometry</text><text class="plan-part-note" x="623" y="931" text-anchor="middle">hue · chroma · HDR volume</text></g><text class="invariant plan-invariant" x="436" y="978">Color cannot recompile tone; HDR caps peak</text></g>
      <path class="object-flow" d="M560 992 L560 1014" marker-end="url(#arrow)"/>
      <g class="object"><rect class="object-shell" x="420" y="1026" width="280" height="106" rx="9"/><text class="object-title" x="436" y="1052">Display Formation</text><text class="behavior" x="436" y="1076">• Composes Tone + Color by formation mode</text><text class="behavior" x="436" y="1098">• Runs AgX / gated / lum / neutral or film</text><text class="invariant" x="436" y="1122">AgX: scene → HDR · Film: print + highlights</text></g>
    </g>

    <g class="context delivery-context">
      <rect class="context-shell" x="752" y="558" width="320" height="602" rx="12"/><path class="context-divider" d="M772 646 L1052 646"/>
      <text class="context-title" x="772" y="588">Delivery context</text><text class="context-subtitle" x="772" y="610">Delivery</text><text class="context-rule" x="772" y="634">Formation decides pixels; delivery packages them.</text>
      <g class="object aggregate"><rect class="object-shell" x="772" y="686" width="280" height="184" rx="9"/><text class="object-title" x="788" y="712">Finished Rendition Set</text><rect class="kind-pill" x="786" y="719" width="78" height="20" rx="10"/><text class="kind" x="825" y="733" text-anchor="middle">Delivery root</text><text class="behavior" x="788" y="762">• Holds SDR, or SDR base + HDR alternate</text><text class="behavior" x="788" y="786">• Declares headroom and output gamut</text><text class="behavior" x="788" y="810">• Pixel formation completes before encoding</text><text class="invariant" x="788" y="850">Delivery reads only finished renditions</text></g>
      <path class="object-flow" d="M912 870 L912 904" marker-end="url(#arrow)"/>
      <g class="object"><rect class="object-shell" x="772" y="916" width="280" height="190" rx="9"/><text class="object-title" x="788" y="942">Delivery Policy</text><text class="behavior" x="788" y="970">• Selects container, quality and chroma</text><text class="behavior" x="788" y="994">• Encodes SDR or a gain-map package</text><text class="behavior" x="788" y="1018">• Reads back and receives measurements</text><text class="behavior" x="788" y="1042">• Applies profile, headroom and error gates</text><text class="invariant" x="788" y="1084">Encoding cannot feed back into formation</text></g>
    </g>

    <path class="context-flow" d="M368 858 L400 858" marker-end="url(#contract-arrow)"/><path class="context-flow" d="M720 858 L752 858" marker-end="url(#contract-arrow)"/>
    <rect class="contract-label-bg capture-contract" x="360" y="832" width="48" height="19" rx="9.5"/><rect class="contract-label-bg delivery-contract" x="717" y="832" width="38" height="19" rx="9.5"/>
    <text class="context-contract" x="384" y="847" text-anchor="middle">evidence</text><text class="context-contract" x="736" y="847" text-anchor="middle">images</text>
  </g>

  <path class="layer-flow" d="M560 1196 L560 1220" marker-end="url(#arrow)"/>
  <g class="layer infrastructure">
    <rect class="layer-shell" x="24" y="1232" width="1072" height="176" rx="14"/><path class="layer-accent" d="M31 1248 L31 1392"/><path class="layer-divider" d="M48 1296 L1072 1296"/>
    <text class="layer-title" x="48" y="1262">04  Infrastructure</text><text class="layer-note" x="48" y="1284">Implements capabilities required by the domain; owns no evidence, development, or delivery rules.</text>
    <g class="capability"><rect x="48" y="1310" width="190" height="62" rx="8"/><text x="143" y="1334" text-anchor="middle">Sensor Evidence Provider</text><text class="behavior" x="143" y="1354" text-anchor="middle">Reads mosaic, CFA and levels</text></g>
    <g class="capability"><rect x="258" y="1310" width="190" height="62" rx="8"/><text x="353" y="1334" text-anchor="middle">Scene Decoder</text><text class="behavior" x="353" y="1354" text-anchor="middle">Produces scene-linear Rec.2020</text></g>
    <g class="capability"><rect x="468" y="1310" width="190" height="62" rx="8"/><text x="563" y="1334" text-anchor="middle">Native Compute Backend</text><text class="behavior" x="563" y="1354" text-anchor="middle">Accelerates formation and output</text></g>
    <g class="capability"><rect x="678" y="1310" width="190" height="62" rx="8"/><text x="773" y="1334" text-anchor="middle">Image + Gain Map Encoder</text><text class="behavior" x="773" y="1354" text-anchor="middle">Encodes and reports read-back</text></g>
    <g class="capability"><rect x="888" y="1310" width="184" height="62" rx="8"/><text x="980" y="1334" text-anchor="middle">Calibration Asset Provider</text><text class="behavior" x="980" y="1354" text-anchor="middle">Sensor, camera and film data</text></g>
    <text class="layer-note" x="48" y="1392">External resources: DNG / RAW files · LibRaw · system RAW services · image containers · local file system</text>
  </g>
</svg>
