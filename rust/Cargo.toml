[package]
name = "dngscan_fast"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "dngscan native kernels (AgX core, SDR output finalizer, HDR formation, film appearance) — Rust port of the pybind11 C++ extension, same ABI"
publish = false

[lib]
name = "_dngscan_fast"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
# No fast-math anywhere: every kernel replicates the NumPy reference's float32
# operation order, and Rust never contracts a*b+c into an FMA on its own (the
# C++ build needed -ffp-contract=off for the same guarantee).
