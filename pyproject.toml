[build-system]
# Rust kernels via setuptools-rust (2026-09: the pybind11/CMake extension was
# ported to Rust with the same module API and ABI). A host without cargo, or
# DNGSCAN_BUILD_NATIVE=OFF, gets the pure-Python wheel — see setup.py.
requires = ["setuptools>=70", "setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

[project]
name = "dngscan"
version = "0.2.0"
description = "RAW scan and AgX render pipeline"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Operating System :: MacOS"]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    # review batch 24: the native/NumPy bit-exact contracts (float32 scalar
    # promotion, NEP 50) are verified on NumPy 2 only — the locked CI version
    "numpy>=2.0",
    "rawpy @ git+https://github.com/Gen-416/rawpy.git@cc7b4748c7b3e87da319198fdfcdb46e17c9c2a6",
    "pillow>=9.2",
]

[project.optional-dependencies]
# A9 item 8: matplotlib gates only the diagnostic dashboard (--scan/--csv);
# a plain conversion must install without it.
scan = ["matplotlib>=3.6"]
native = ["setuptools-rust>=1.10"]
calibration = ["colour-science==0.4.7"]
gui = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52.2,<0.53",
    "pyobjc-framework-Quartz>=12.0; platform_system == 'Darwin'",
]

[dependency-groups]
# scipy: PCHIP interpolation in the importers and the digitization
# precision gate (R11 item 3: without it CI silently SKIPPED
# tests/test_digitization_precision.py); matplotlib for the report
# tools exercised by tests; colour-science for the chroma-field CV
# record gates (route C phase 1) — without it those gates would
# silently skip on CI, the exact failure mode R11 closed.
test = ["httpx2>=2,<3", "scipy>=1.10", "matplotlib>=3.6",
        "fastapi>=0.141.1,<0.142", "uvicorn>=0.52.2,<0.53",
        "colour-science==0.4.7"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["dngscan*"]

[tool.setuptools.package-data]
# The data assets the wheel-smoke CI job loads from the INSTALLED package:
# priors JSONs, film_optics/film_v2/appearance assets (npz), lens library,
# spectral data.
dngscan = ["**/*.json", "**/*.npz", "**/*.txt"]
