[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "dngscan"
version = "0.2.0"
description = "RAW scan and AgX render pipeline"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Operating System :: MacOS"]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "rawpy @ git+https://github.com/Gen-416/rawpy.git@cc7b4748c7b3e87da319198fdfcdb46e17c9c2a6",
    "matplotlib>=3.6",
    "pillow>=9.2",
]

[project.optional-dependencies]
native = ["pybind11>=2.11"]
calibration = ["colour-science>=0.4.4"]
gui = ["pyobjc-framework-Quartz>=12.0; platform_system == 'Darwin'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dngscan*"]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["dngscan"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
# Native ON by default (review batch 17); export DNGSCAN_BUILD_NATIVE=OFF
# through SKBUILD_CMAKE_DEFINE for a pure-Python build.
DNGSCAN_BUILD_NATIVE = "ON"
